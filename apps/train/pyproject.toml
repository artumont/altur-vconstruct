[project]
name = "hackmty26-train"
version = "0.1.0"
description = "Voice anti-spoofing classifier — real vs synthetic caller detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch[device-gfx1102]==2.15.0a0+rocm10.2.0a20260912",
    "torchaudio==2.11.0.3+rocm10.2.0a20260912",
    "transformers>=4.40",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "einops>=0.7",
    "pandas-stubs>=3.0.5.260730",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[project.scripts]
train = "src.__main__:main"

[[tool.uv.index]]
name = "amd-rocm"
url = "https://nightly.repo.amd.com/rocm/whl-next/"
priority = "explicit"

[tool.uv.sources]
torch = { index = "amd-rocm" }
torchaudio = { index = "amd-rocm" }
triton = { index = "amd-rocm" }

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = ["unit: fast isolated unit tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true
preview = true
exclude = ["dist", "build", ".venv", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "D", "DOC"]
fixable = ["ALL"]
ignore = [
  "E501",  # Line too long
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic methods
  "D107",  # Missing docstring in __init__ constructors
  "D415",  # Missing end punctuation in docstring's first line
  "D400",  # First line should end with a period, question mark, or exclamation point
  "D213",  # Multi-line docstring summary should start at the second line
  "D203",  # 1 blank line required before class docstring
  "D420",  # Section "Returns" appears after section "Raises" but should be before it
  "DOC502",  # Disables warnings for exceptions in docs not raised by the code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[project]
name = "hackmty26-api"
version = "0.1.0"
description = "Voice anti-spoofing API — POST /detect for human vs synthetic caller"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    "joblib>=1.3",
    "pandas>=2.2",
    "transformers>=4.40",
    "scikit-learn>=1.4",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"


[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true
preview = true
exclude = ["dist", "build", ".venv", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "D", "DOC"]
fixable = ["ALL"]
ignore = [
  "E501",  # Line too long
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic methods
  "D107",  # Missing docstring in __init__ constructors
  "D415",  # Missing end punctuation in docstring's first line
  "D400",  # First line should end with a period, question mark, or exclamation point
  "D213",  # Multi-line docstring summary should start at the second line
  "D203",  # 1 blank line required before class docstring
  "D420",  # Section "Returns" appears after section "Raises" but should be before it
  "DOC502",  # Disables warnings for exceptions in docs not raised by the code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
